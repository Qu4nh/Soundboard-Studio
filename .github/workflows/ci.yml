name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check repository allowlist
        shell: pwsh
        run: |
          $unexpected = git ls-files --cached --ignored --exclude-standard
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unexpected) { throw "Tracked paths outside .gitignore allowlist: $unexpected" }
      - run: npm ci
      - run: npm run verify
